<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的遊戲館 | 精選小遊戲集合</title>
    <style>
        :root {
            --color-bg: #1a1a2e;
            --color-card-bg: #2d2d44;
            --color-card-hover: #3d3d5c;
            --color-accent: #6c63ff;
            --border-radius: 12px;
            --transition-speed: 0.25s;
            --shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--color-bg);
            color: #fff;
            min-height: 100vh;
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        header {
            margin-bottom: 3rem;
            text-align: center;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #ff6b6b, #6c63ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #aaa;
            max-width: 600px;
            margin: 0 auto;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            justify-items: center;
            margin-top: 2rem;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--color-card-bg);
            width: 100%;
            max-width: 200px;
            padding: 2rem 1.5rem;
            border-radius: var(--border-radius);
            text-decoration: none;
            color: inherit;
            transition: all var(--transition-speed) ease;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-card:hover,
        .game-card:focus {
            background: var(--color-card-hover);
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        .game-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .game-title {
            font-weight: 600;
            font-size: 1.2rem;
            text-align: center;
        }

        footer {
            margin-top: 4rem;
            color: #777;
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }

            .game-card {
                padding: 1.5rem 1rem;
            }

            .game-icon {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 我的遊戲館</h1>
            <p class="subtitle">精選小遊戲合集 | 輕鬆娛樂，隨時暢玩</p>
        </header>

        <main>
            <div class="games-grid">
                <a href="game1.html" class="game-card" aria-label="進入猜數字遊戲">
                    <div class="game-icon">🎯</div>
                    <div class="game-title">猜數字</div>
                </a>
                <a href="game2.html" class="game-card" aria-label="進入包剪揼遊戲">
                    <div class="game-icon">✊</div>
                    <div class="game-title">包剪揼</div>
                </a>
                <!-- 可在此繼續添加更多遊戲 -->
            </div>
        </main>

        <footer>
            <p>© 2023 我的遊戲館 | 持續更新中</p>
        </footer>
    </div>
</body>
</html>
