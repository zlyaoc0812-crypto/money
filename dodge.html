<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>躲避障礙物 - 新架構</title>
    <link rel="stylesheet" href="./design-system/variables.css">
    <link rel="stylesheet" href="./design-system/base.css">
    <link rel="stylesheet" href="./design-system/components.css">
    <style>
        /* 遊戲特定樣式 */
        .game-container {
            background: rgba(30, 30, 46, 0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 900px;
            border: 3px solid var(--color-accent-3);
            margin: 0 auto;
        }

        .game-area-wrapper {
            position: relative;
            margin-bottom: 30px;
        }

        .game-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .game-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
        }

        .info-box {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
        }

        .info-box h3 {
            color: var(--color-accent-3);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .info-box p {
            font-size: 1.8rem;
            font-weight: bold;
        }

        #score { color: var(--color-warning); }
        #time { color: var(--color-success); }
        #combo { color: var(--color-danger); }
        #lives { color: var(--color-accent-1); }

        .difficulty-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .difficulty-btn {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .difficulty-btn:hover, .difficulty-btn.active {
            background: rgba(245, 158, 11, 0.3);
            border-color: var(--color-accent-3);
            transform: scale(1.05);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .mobile-controls {
            display: none;
            margin-top: 20px;
            justify-content: center;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 150px;
            height: 150px;
        }

        .d-pad-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .d-pad-btn:active {
            background: rgba(245, 158, 11, 0.5);
            transform: scale(0.95);
        }

        .d-pad-btn.up { grid-column: 2; grid-row: 1; }
        .d-pad-btn.left { grid-column: 1; grid-row: 2; }
        .d-pad-btn.center { grid-column: 2; grid-row: 2; }
        .d-pad-btn.right { grid-column: 3; grid-row: 2; }
        .d-pad-btn.down { grid-column: 2; grid-row: 3; }

        .instructions {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            max-width: 900px;
            margin: 30px auto 0;
            border-left: 5px solid var(--color-accent-3);
        }

        .instructions h3 {
            color: var(--color-accent-3);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .instructions h3::before {
            content: '🎮';
            font-size: 1.5rem;
        }

        .control-keys {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .key {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .key-icon {
            font-size: 1.8rem;
            color: var(--color-accent-3);
        }

        .key-text {
            flex: 1;
        }

        .powerups-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .powerup {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .powerup-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .powerup-text {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-overlay.show {
            display: flex;
            animation: fadeIn 0.5s;
        }

        .overlay-content {
            background: rgba(30, 30, 46, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid var(--color-accent-3);
            max-width: 500px;
            width: 90%;
        }

        .final-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .stat {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
        }

        .stat h4 {
            color: var(--color-accent-3);
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .stat p {
            font-size: 2rem;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .game-info {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .control-keys {
                grid-template-columns: 1fr;
            }
            
            .powerups-info {
                grid-template-columns: 1fr;
            }
            
            .final-stats {
                grid-template-columns: 1fr;
            }
            
            .mobile-controls {
                display: flex;
            }
        }

        @media (max-width: 480px) {
            .game-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
  <div class="gs-container">
    <div class="gs-game-area">
    <div class="game-overlay" id="gameOverlay">
        <div class="overlay-content">
            <h2>🎮 遊戲結束</h2>
            <div class="final-stats">
                <div class="stat">
                    <h4>最終分數</h4>
                    <p id="finalScore">0</p>
                </div>
                <div class="stat">
                    <h4>生存時間</h4>
                    <p id="finalTime">0s</p>
                </div>
                <div class="stat">
                    <h4>最大連擊</h4>
                    <p id="finalCombo">0</p>
                </div>
                <div class="stat">
                    <h4>收集道具</h4>
                    <p id="finalPowerups">0</p>
                </div>
            </div>
            <button id="restartBtn" class="btn btn-primary">🔄 重新開始</button>
            <a href="index.html" class="btn btn-secondary">← 返回遊戲館</a>
        </div>
    </div>

    <div class="header">
        <h1>🤡 躲避障礙物 🚀</h1>
        <p>靈活閃避各種障礙，收集道具，挑戰生存極限！</p>
    </div>

    <div class="game-container">
        <div class="difficulty-selector">
            <div class="difficulty-btn active" data-difficulty="easy">簡單</div>
            <div class="difficulty-btn" data-difficulty="medium">中等</div>
            <div class="difficulty-btn" data-difficulty="hard">困難</div>
        </div>

        <div class="game-info">
            <div class="info-box">
                <h3>分數</h3>
                <p id="score">0</p>
            </div>
            <div class="info-box">
                <h3>時間</h3>
                <p id="time">0</p>
            </div>
            <div class="info-box">
                <h3>連擊數</h3>
                <p id="combo">0</p>
            </div>
            <div class="info-box">
                <h3>生命</h3>
                <p id="lives">3</p>
            </div>
        </div>

        <div class="game-area-wrapper">
            <div class="game-area" id="gameArea">
                <canvas id="gameCanvas" width="800" height="500"></canvas>
            </div>
            
            <div class="mobile-controls">
                <div class="d-pad">
                    <button class="d-pad-btn up">⬆️</button>
                    <button class="d-pad-btn left">⬅️</button>
                    <button class="d-pad-btn center">⚡</button>
                    <button class="d-pad-btn right">➡️</button>
                    <button class="d-pad-btn down">⬇️</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">🎮 開始遊戲</button>
            <button id="pauseBtn" class="btn btn-secondary">⏸️ 暫停遊戲</button>
            <button id="resetBtn" class="btn btn-warning">🔄 重新開始</button>
            <button id="dashBtn" class="btn btn-danger">⚡ 衝刺</button>
        </div>
    </div>

    <div class="instructions">
        <h3>遊戲控制</h3>
        <div class="control-keys">
            <div class="key">
                <div class="key-icon">W / ⬆️</div>
                <div class="key-text">向上移動</div>
            </div>
            <div class="key">
                <div class="key-icon">A / ⬅️</div>
                <div class="key-text">向左移動</div>
            </div>
            <div class="key">
                <div class="key-icon">S / ⬇️</div>
                <div class="key-text">向下移動</div>
            </div>
            <div class="key">
                <div class="key-icon">D / ➡️</div>
                <div class="key-text">向右移動</div>
            </div>
            <div class="key">
                <div class="key-icon">空格鍵</div>
                <div class="key-text">衝刺</div>
            </div>
            <div class="key">
                <div class="key-icon">P</div>
                <div class="key-text">暫停/繼續</div>
            </div>
        </div>
        
        <h3>道具說明</h3>
        <div class="powerups-info">
            <div class="powerup">
                <div class="powerup-icon">❤️</div>
                <div class="powerup-text">生命恢復 +1</div>
            </div>
            <div class="powerup">
                <div class="powerup-icon">⚡</div>
                <div class="powerup-text">衝刺能量 +50%</div>
            </div>
            <div class="powerup">
                <div class="powerup-icon">🛡️</div>
                <div class="powerup-text">無敵護盾 5秒</div>
            </div>
            <div class="powerup">
                <div class="powerup-icon">💰</div>
                <div class="powerup-text">分數加倍 10秒</div>
            </div>
            <div class="powerup">
                <div class="powerup-icon">🌀</div>
                <div class="powerup-text">清除所有障礙</div>
            </div>
            <div class="powerup">
                <div class="powerup-icon">🎯</div>
                <div class="powerup-text">自動導航 8秒</div>
            </div>
        </div>
    </div>

    <a href="index.html" class="back-btn">← 返回遊戲館</a>

    <script type="module">
        import { Dodge } from './src/games/Dodge.js';

        // 初始化遊戲
        const game = new Dodge({
            id: 'dodge',
            name: '躲避障礙物',
            fps: 60,
            maxFps: 120,
            initialLives: 3,
            maxLives: 5,
            canvas: {
                width: 800,
                height: 500,
                containerId: 'gameCanvas'
            },
            debug: {
                enabled: false,
                showFps: true,
                showPerformance: true
            },
            features: {
                sound: true,
                vibration: true,
                particles: true,
                animations: true
            }
        });

        // DOM 元素引用
        const scoreElement = document.getElementById('score');
        const timeElement = document.getElementById('time');
        const comboElement = document.getElementById('combo');
        const livesElement = document.getElementById('lives');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const dashBtn = document.getElementById('dashBtn');
        const gameOverlay = document.getElementById('gameOverlay');
        const finalScoreElement = document.getElementById('finalScore');
        const finalTimeElement = document.getElementById('finalTime');
        const finalComboElement = document.getElementById('finalCombo');
        const finalPowerupsElement = document.getElementById('finalPowerups');
        const restartBtn = document.getElementById('restartBtn');
        const difficultyBtns = document.querySelectorAll('.difficulty-btn');
        const dPadBtns = document.querySelectorAll('.d-pad-btn');

        // 事件監聽器
        game.events.on('score:update', (data) => {
            scoreElement.textContent = data.score;
        });

        game.events.on('lives:update', (data) => {
            livesElement.textContent = data.lives;
        });

        game.events.on('combo:update', (data) => {
            comboElement.textContent = data.combo;
        });

        game.events.on('game:over', (data) => {
            finalScoreElement.textContent = data.score;
            finalTimeElement.textContent = `${Math.floor(data.time / 1000)}s`;
            finalComboElement.textContent = data.maxCombo;
            finalPowerupsElement.textContent = data.powerupsCollected;
            gameOverlay.classList.add('show');
        });

        // 按鈕事件
        startBtn.addEventListener('click', () => {
            game.start();
            startBtn.disabled = true;
            startBtn.textContent = '遊戲進行中...';
            pauseBtn.disabled = false;
            resetBtn.disabled = false;
            dashBtn.disabled = false;
            gameOverlay.classList.remove('show');
        });

        pauseBtn.addEventListener('click', () => {
            if (game.state.isPaused) {
                game.resume();
                pauseBtn.textContent = '⏸️ 暫停遊戲';
            } else {
                game.pause();
                pauseBtn.textContent = '▶️ 繼續遊戲';
            }
        });

        resetBtn.addEventListener('click', () => {
            game.restart();
            startBtn.disabled = false;
            startBtn.textContent = '🎮 開始遊戲';
            pauseBtn.disabled = true;
            pauseBtn.textContent = '⏸️ 暫停遊戲';
            dashBtn.disabled = true;
            gameOverlay.classList.remove('show');
        });

        dashBtn.addEventListener('click', () => {
            game.playerDash();
        });

        restartBtn.addEventListener('click', () => {
            game.restart();
            startBtn.disabled = false;
            startBtn.textContent = '🎮 開始遊戲';
            pauseBtn.disabled = true;
            pauseBtn.textContent = '⏸️ 暫停遊戲';
            dashBtn.disabled = true;
            gameOverlay.classList.remove('show');
        });

        // 難度設置
        difficultyBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (!game.state.isRunning) {
                    difficultyBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    game.setDifficulty(btn.dataset.difficulty);
                }
            });
        });

        // 移動控制按鈕
        dPadBtns.forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const direction = btn.textContent;
                switch(direction) {
                    case '⬆️':
                        game._handleKeyDown({ key: 'ArrowUp' });
                        break;
                    case '⬅️':
                        game._handleKeyDown({ key: 'ArrowLeft' });
                        break;
                    case '➡️':
                        game._handleKeyDown({ key: 'ArrowRight' });
                        break;
                    case '⬇️':
                        game._handleKeyDown({ key: 'ArrowDown' });
                        break;
                    case '⚡':
                        game.playerDash();
                        break;
                }
            });

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                const direction = btn.textContent;
                switch(direction) {
                    case '⬆️':
                        game._handleKeyUp({ key: 'ArrowUp' });
                        break;
                    case '⬅️':
                        game._handleKeyUp({ key: 'ArrowLeft' });
                        break;
                    case '➡️':
                        game._handleKeyUp({ key: 'ArrowRight' });
                        break;
                    case '⬇️':
                        game._handleKeyUp({ key: 'ArrowDown' });
                        break;
                }
            });
        });

        // 鍵盤控制
        document.addEventListener('keydown', (event) => {
            if (!game.state.isRunning || game.state.isPaused) return;
            
            switch(event.key) {
                case 'w':
                case 'W':
                case 'ArrowUp':
                    game._handleKeyDown({ key: 'ArrowUp' });
                    break;
                case 'a':
                case 'A':
                case 'ArrowLeft':
                    game._handleKeyDown({ key: 'ArrowLeft' });
                    break;
                case 's':
                case 'S':
                case 'ArrowDown':
                    game._handleKeyDown({ key: 'ArrowDown' });
                    break;
                case 'd':
                case 'D':
                case 'ArrowRight':
                    game._handleKeyDown({ key: 'ArrowRight' });
                    break;
                case ' ':
                    game.playerDash();
                    break;
                case 'p':
                case 'P':
                    game.togglePause();
                    pauseBtn.textContent = game.state.isPaused ? '▶️ 繼續遊戲' : '⏸️ 暫停遊戲';
                    break;
            }
        });

        document.addEventListener('keyup', (event) => {
            if (!game.state.isRunning || game.state.isPaused) return;
            
            switch(event.key) {
                case 'w':
                case 'W':
                case 'ArrowUp':
                    game._handleKeyUp({ key: 'ArrowUp' });
                    break;
                case 'a':
                case 'A':
                case 'ArrowLeft':
                    game._handleKeyUp({ key: 'ArrowLeft' });
                    break;
                case 's':
                case 'S':
                case 'ArrowDown':
                    game._handleKeyUp({ key: 'ArrowDown' });
                    break;
                case 'd':
                case 'D':
                case 'ArrowRight':
                    game._handleKeyUp({ key: 'ArrowRight' });
                    break;
            }
        });

        // 初始化遊戲
        game.init().then(() => {
            console.log('躲避障礙物遊戲初始化完成');
        }).catch(error => {
            console.error('遊戲初始化失敗:', error);
        });
    </script>
  </div> <!-- gs-game-area -->
  </div> <!-- gs-container -->
</body>
</html>
