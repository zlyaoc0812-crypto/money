<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空射擊 - 新架構</title>
    <link rel="stylesheet" href="./design-system/variables.css">
    <link rel="stylesheet" href="./design-system/base.css">
    <link rel="stylesheet" href="./design-system/components.css">
    <style>
        /* 遊戲特定樣式 */
        .game-container {
            background: rgba(30, 30, 46, 0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 900px;
            border: 3px solid var(--color-accent-1);
            margin: 0 auto;
        }

        .game-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
            position: relative;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
        }

        .info-box {
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
        }

        .info-box h3 {
            color: var(--color-accent-1);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .info-box p {
            font-size: 1.8rem;
            font-weight: bold;
        }

        #score { color: var(--color-warning); }
        #level { color: var(--color-success); }
        #lives { color: var(--color-danger); }
        #power { color: var(--color-accent-4); }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .instructions {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            max-width: 900px;
            margin: 30px auto 0;
            border-left: 5px solid var(--color-accent-1);
        }

        .instructions h3 {
            color: var(--color-accent-1);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .instructions h3::before {
            content: '🎮';
            font-size: 1.5rem;
        }

        .key-controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .key {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .key-icon {
            font-size: 1.8rem;
            color: var(--color-accent-1);
        }

        .key-text {
            flex: 1;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            display: none;
            border: 3px solid var(--color-accent-1);
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.5);
        }

        .game-over.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        .level-up {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            display: none;
            border: 3px solid var(--color-success);
            box-shadow: 0 0 50px rgba(16, 185, 129, 0.5);
        }

        .level-up.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        @media (max-width: 768px) {
            .info-panel {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .key-controls {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .info-panel {
                grid-template-columns: 1fr;
            }
        }

        /* Back button styling */
        .back-btn {
            display: inline-block;
            padding: 12px 24px;
            background: var(--gradient-secondary);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            background: var(--gradient-primary);
        }

        .back-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
  <div class="gs-container">
    <div class="gs-game-area">
    <div class="header">
        <h1>🚀 太空射擊 👾</h1>
        <p>駕駛飛船消滅敵機，收集能量，挑戰無盡關卡！</p>
    </div>

    <div class="game-container">
        <div class="game-area">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
            <div class="game-over" id="gameOver">
                <h2>💀 遊戲結束</h2>
                <p id="finalScore">最終分數: 0</p>
                <p id="finalLevel">最高關卡: 1</p>
                <p id="finalEnemies">擊敗敵機: 0</p>
                <button id="restartBtn" class="btn btn-primary">🔄 重新開始</button>
                <a href="index.html" class="btn btn-secondary">← 返回遊戲館</a>
            </div>
            <div class="level-up" id="levelUpScreen">
                <h2>🎉 關卡升級！</h2>
                <p id="newLevel">新關卡: 2</p>
                <p>敵機速度增加！</p>
                <p>獲得額外生命！</p>
                <button id="continueBtn" class="btn btn-primary">▶️ 繼續遊戲</button>
            </div>
        </div>

        <div class="info-panel">
            <div class="info-box">
                <h3>分數</h3>
                <p id="score">0</p>
            </div>
            <div class="info-box">
                <h3>關卡</h3>
                <p id="level">1</p>
            </div>
            <div class="info-box">
                <h3>生命</h3>
                <p id="lives">3</p>
            </div>
            <div class="info-box">
                <h3>能量</h3>
                <p id="power">100%</p>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">🎮 開始遊戲</button>
            <button id="pauseBtn" class="btn btn-secondary">⏸️ 暫停遊戲</button>
            <button id="resetBtn" class="btn btn-warning">🔄 重新開始</button>
            <button id="fireBtn" class="btn btn-danger">🔥 發射子彈</button>
        </div>
    </div>

    <div class="instructions">
        <h3>遊戲控制</h3>
        <div class="key-controls">
            <div class="key">
                <div class="key-icon">⬅️</div>
                <div class="key-text">向左移動</div>
            </div>
            <div class="key">
                <div class="key-icon">➡️</div>
                <div class="key-text">向右移動</div>
            </div>
            <div class="key">
                <div class="key-icon">⬆️</div>
                <div class="key-text">向上移動</div>
            </div>
            <div class="key">
                <div class="key-icon">⬇️</div>
                <div class="key-text">向下移動</div>
            </div>
            <div class="key">
                <div class="key-icon">空格鍵</div>
                <div class="key-text">發射子彈</div>
            </div>
            <div class="key">
                <div class="key-icon">P</div>
                <div class="key-text">暫停/繼續</div>
            </div>
        </div>
    </div>

    <a href="index.html" class="back-btn">← 返回遊戲館</a>

    <script type="module">
        import { SpaceShooter } from './src/games/SpaceShooter.js';

        // 初始化遊戲
        const game = new SpaceShooter({
            id: 'spaceshooter',
            name: '太空射擊',
            fps: 60,
            maxFps: 120,
            initialLives: 3,
            maxLives: 5,
            canvas: {
                width: 800,
                height: 500,
                containerId: 'gameCanvas'
            },
            debug: {
                enabled: false,
                showFps: true,
                showPerformance: true
            },
            features: {
                sound: true,
                vibration: true,
                particles: true,
                animations: true
            }
        });

        // DOM 元素引用
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const livesElement = document.getElementById('lives');
        const powerElement = document.getElementById('power');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const fireBtn = document.getElementById('fireBtn');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const finalLevelElement = document.getElementById('finalLevel');
        const finalEnemiesElement = document.getElementById('finalEnemies');
        const restartBtn = document.getElementById('restartBtn');
        const levelUpScreen = document.getElementById('levelUpScreen');
        const newLevelElement = document.getElementById('newLevel');
        const continueBtn = document.getElementById('continueBtn');

        // 事件監聽器
        game.events.on('score:update', (data) => {
            scoreElement.textContent = data.score;
        });

        game.events.on('level:up', (data) => {
            levelElement.textContent = data.level;
            newLevelElement.textContent = `新關卡: ${data.level}`;
            levelUpScreen.classList.add('show');
        });

        game.events.on('lives:update', (data) => {
            livesElement.textContent = data.lives;
        });

        game.events.on('game:over', (data) => {
            finalScoreElement.textContent = `最終分數: ${data.score}`;
            finalLevelElement.textContent = `最高關卡: ${data.level}`;
            finalEnemiesElement.textContent = `擊敗敵機: ${data.enemiesDefeated}`;
            gameOverScreen.classList.add('show');
        });

        // 按鈕事件
        startBtn.addEventListener('click', () => {
            game.start();
            startBtn.disabled = true;
            startBtn.textContent = '遊戲進行中...';
            pauseBtn.disabled = false;
            resetBtn.disabled = false;
            fireBtn.disabled = false;
            gameOverScreen.classList.remove('show');
            levelUpScreen.classList.remove('show');
        });

        pauseBtn.addEventListener('click', () => {
            if (game.state.isPaused) {
                game.resume();
                pauseBtn.textContent = '⏸️ 暫停遊戲';
            } else {
                game.pause();
                pauseBtn.textContent = '▶️ 繼續遊戲';
            }
        });

        resetBtn.addEventListener('click', () => {
            game.restart();
            startBtn.disabled = false;
            startBtn.textContent = '🎮 開始遊戲';
            pauseBtn.disabled = true;
            pauseBtn.textContent = '⏸️ 暫停遊戲';
            fireBtn.disabled = true;
            gameOverScreen.classList.remove('show');
            levelUpScreen.classList.remove('show');
        });

        fireBtn.addEventListener('click', () => {
            game.fireBullet();
        });

        restartBtn.addEventListener('click', () => {
            game.restart();
            startBtn.disabled = false;
            startBtn.textContent = '🎮 開始遊戲';
            pauseBtn.disabled = true;
            pauseBtn.textContent = '⏸️ 暫停遊戲';
            fireBtn.disabled = true;
            gameOverScreen.classList.remove('show');
            levelUpScreen.classList.remove('show');
        });

        continueBtn.addEventListener('click', () => {
            levelUpScreen.classList.remove('show');
        });

        // 鍵盤控制
        document.addEventListener('keydown', (event) => {
            if (!game.state.isRunning || game.state.isPaused) return;
            
            switch(event.key) {
                case 'ArrowLeft':
                    game._handleKeyDown({ key: 'ArrowLeft' });
                    break;
                case 'ArrowRight':
                    game._handleKeyDown({ key: 'ArrowRight' });
                    break;
                case 'ArrowUp':
                    game._handleKeyDown({ key: 'ArrowUp' });
                    break;
                case 'ArrowDown':
                    game._handleKeyDown({ key: 'ArrowDown' });
                    break;
                case ' ':
                    game.fireBullet();
                    break;
                case 'p':
                case 'P':
                    game.togglePause();
                    pauseBtn.textContent = game.state.isPaused ? '▶️ 繼續遊戲' : '⏸️ 暫停遊戲';
                    break;
            }
        });

        document.addEventListener('keyup', (event) => {
            if (!game.state.isRunning || game.state.isPaused) return;
            
            switch(event.key) {
                case 'ArrowLeft':
                    game._handleKeyUp({ key: 'ArrowLeft' });
                    break;
                case 'ArrowRight':
                    game._handleKeyUp({ key: 'ArrowRight' });
                    break;
                case 'ArrowUp':
                    game._handleKeyUp({ key: 'ArrowUp' });
                    break;
                case 'ArrowDown':
                    game._handleKeyUp({ key: 'ArrowDown' });
                    break;
            }
        });

        // 初始化遊戲
        game.init().then(() => {
            console.log('太空射擊遊戲初始化完成');
        }).catch(error => {
            console.error('遊戲初始化失敗:', error);
        });
    </script>
  </div> <!-- gs-game-area -->
  </div> <!-- gs-container -->
</body>
</html>
