<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極限躲避大挑戰</title>
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #141E30, #243B55);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ff9a00;
            text-shadow: 0 0 15px rgba(255, 154, 0, 0.7);
            animation: titleGlow 2s infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 0 0 10px rgba(255, 154, 0, 0.7); }
            to { text-shadow: 0 0 25px rgba(255, 154, 0, 1); }
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
        }

        .game-area-wrapper {
            position: relative;
            width: 600px;
            height: 400px;
            margin-bottom: 30px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .game-area {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #ff9a00;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 
                0 0 30px rgba(255, 154, 0, 0.3),
                inset 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .game-background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 184, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 255, 157, 0.1) 0%, transparent 50%);
            z-index: 1;
        }

        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #00ff9d, #00b8ff);
            border-radius: 50%;
            box-shadow: 
                0 0 25px rgba(0, 255, 157, 0.8),
                0 0 50px rgba(0, 184, 255, 0.4),
                inset 0 0 15px rgba(255, 255, 255, 0.3);
            transition: transform 0.1s;
            z-index: 20;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .obstacle {
            position: absolute;
            border-radius: 12px;
            box-shadow: 
                0 0 20px rgba(255, 65, 108, 0.8),
                inset 0 0 10px rgba(255, 255, 255, 0.2);
            z-index: 10;
            transition: transform 0.3s;
        }

        .obstacle.small { 
            background: linear-gradient(135deg, #ff416c, #ff6b6b); 
        }
        .obstacle.medium { 
            background: linear-gradient(135deg, #ff4b2b, #ff8a00); 
        }
        .obstacle.large { 
            background: linear-gradient(135deg, #ff0000, #ff3838); 
        }

        .collectible {
            position: absolute;
            width: 25px;
            height: 25px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #ffa500);
            border-radius: 50%;
            animation: pulse 1s infinite alternate, float 3s infinite ease-in-out;
            box-shadow: 
                0 0 20px rgba(255, 215, 0, 0.8),
                0 0 40px rgba(255, 165, 0, 0.5);
            z-index: 15;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(180deg); }
        }

        .powerup {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            animation: spin 2s infinite linear, float 2s infinite ease-in-out;
            box-shadow: 0 0 25px;
            z-index: 15;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .powerup.shield { 
            background: radial-gradient(circle at 30% 30%, #ffff00, #ffaa00);
            box-shadow: 0 0 25px rgba(255, 255, 0, 0.8);
        }
        .powerup.speed { 
            background: radial-gradient(circle at 30% 30%, #00ff88, #00cc66);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
        }
        .powerup.magnet { 
            background: radial-gradient(circle at 30% 30%, #9966ff, #6633cc);
            box-shadow: 0 0 25px rgba(153, 102, 255, 0.8);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .game-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .info-box {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            transition: transform 0.3s;
        }

        .info-box:hover {
            transform: translateY(-5px);
            background: rgba(0, 0, 0, 0.5);
        }

        .info-box h3 {
            color: #00ff9d;
            margin-bottom: 10px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .info-box p {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px currentColor;
        }

        #score { color: #ffd700; }
        #time { color: #00ff9d; }
        #highScore { color: #ff6b6b; }
        #powerups { color: #9966ff; }

        .difficulty-selector {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .difficulty-btn.active {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 154, 0, 0.7);
        }

        .difficulty-btn.easy {
            border-color: #00ff9d;
            color: #00ff9d;
        }

        .difficulty-btn.medium {
            border-color: #ff9a00;
            color: #ff9a00;
        }

        .difficulty-btn.hard {
            border-color: #ff416c;
            color: #ff416c;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #startBtn {
            background: linear-gradient(45deg, #ff9a00, #ff6a00);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 154, 0, 0.4);
        }

        #pauseBtn {
            background: linear-gradient(45deg, #00b8ff, #0099cc);
            color: white;
            box-shadow: 0 5px 20px rgba(0, 184, 255, 0.4);
        }

        #resetBtn {
            background: linear-gradient(45deg, #ff6b6b, #ff4757);
            color: white;
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        button:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .powerup-display {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .active-powerup {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            animation: pulse 1.5s infinite alternate;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .instructions {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            max-width: 800px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .instructions h3 {
            color: #00b8ff;
            margin-bottom: 15px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .control-keys {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .key {
            background: rgba(0, 184, 255, 0.3);
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            min-width: 150px;
            border: 2px solid rgba(0, 184, 255, 0.5);
            transition: all 0.3s;
        }

        .key:hover {
            transform: scale(1.05);
            background: rgba(0, 184, 255, 0.5);
        }

        .powerups-info {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .powerup-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hit-effect {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: explode 0.6s ease-out;
            z-index: 30;
        }

        @keyframes explode {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }

        .combo-display {
            position: absolute;
            top: 10px;
            left: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ff4757);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.2rem;
            transform: scale(0);
            transition: transform 0.3s;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.5);
        }

        .combo-display.active {
            transform: scale(1);
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .game-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .overlay-content {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transform: translateY(20px);
            transition: transform 0.5s;
        }

        .game-overlay.active .overlay-content {
            transform: translateY(0);
        }

        .overlay-content h2 {
            color: #ff9a00;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .final-stats {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 25px 0;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-value {
            color: #ffd700;
            font-weight: bold;
        }

        .mobile-controls {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
        }

        .mobile-controls .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
        }

        .mobile-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            user-select: none;
        }

        .mobile-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        .mobile-btn.up {
            grid-column: 2;
            grid-row: 1;
        }

        .mobile-btn.left {
            grid-column: 1;
            grid-row: 2;
        }

        .mobile-btn.right {
            grid-column: 3;
            grid-row: 2;
        }

        .mobile-btn.down {
            grid-column: 2;
            grid-row: 3;
        }

        .mobile-btn.dash {
            position: absolute;
            right: -80px;
            bottom: 60px;
            background: rgba(255, 154, 0, 0.3);
            border-color: #ff9a00;
        }

        .back-btn {
            margin-top: 30px;
            padding: 14px 35px;
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(108, 92, 231, 0.4);
        }

        .back-btn:hover {
            background: linear-gradient(45deg, #5b4fdc, #8e7cf7);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.6);
        }

        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            opacity: 0.7;
        }

        @media (max-width: 650px) {
            .game-area-wrapper {
                width: 95vw;
                height: 60vw;
                max-height: 400px;
            }
            
            .game-info {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 300px;
            }
            
            .control-keys, .powerups-info {
                flex-direction: column;
                align-items: center;
            }
            
            .key, .powerup-info {
                width: 100%;
                max-width: 300px;
            }
            
            .mobile-controls {
                display: block;
            }
        }
  </style>
  <link rel="stylesheet" href="./design-system/variables.css">
  <link rel="stylesheet" href="./docs/design-system/base.css">
</head>
<body>
  <div class="gs-container">
    <div class="gs-game-area">
    <div class="game-overlay" id="gameOverlay">
        <div class="overlay-content">
            <h2 id="overlayTitle">遊戲結束</h2>
            <div class="final-stats">
                <div class="stat">
                    <span>最終分數:</span>
                    <span class="stat-value" id="finalScore">0</span>
                </div>
                <div class="stat">
                    <span>生存時間:</span>
                    <span class="stat-value" id="finalTime">0s</span>
                </div>
                <div class="stat">
                    <span>收集道具:</span>
                    <span class="stat-value" id="finalPowerups">0</span>
                </div>
                <div class="stat">
                    <span>最高連擊:</span>
                    <span class="stat-value" id="finalCombo">0</span>
                </div>
                <div class="stat">
                    <span>最高分數:</span>
                    <span class="stat-value" id="finalHighScore">0</span>
                </div>
            </div>
            <button id="restartBtn" style="margin-top: 20px;">
                <span>🔄</span> 再玩一次
            </button>
        </div>
    </div>

    <div class="header">
        <h1>🤡 極限躲避大挑戰 - 增強版</h1>
        <p>靈活閃避，收集道具，挑戰生存極限！</p>
    </div>

    <div class="game-container">
        <div class="difficulty-selector">
            <button class="difficulty-btn easy active" data-difficulty="easy">簡單</button>
            <button class="difficulty-btn medium" data-difficulty="medium">普通</button>
            <button class="difficulty-btn hard" data-difficulty="hard">困難</button>
        </div>

        <div class="game-area-wrapper">
            <div class="game-area" id="gameArea">
                <div class="game-background"></div>
                <div id="player"></div>
                <!-- 遊戲元素將由JavaScript生成 -->
            </div>
            <div class="mobile-controls">
                <div class="d-pad">
                    <div class="mobile-btn up" data-key="ArrowUp">↑</div>
                    <div class="mobile-btn left" data-key="ArrowLeft">←</div>
                    <div class="mobile-btn right" data-key="ArrowRight">→</div>
                    <div class="mobile-btn down" data-key="ArrowDown">↓</div>
                    <div class="mobile-btn dash" data-key=" ">💨</div>
                </div>
            </div>
        </div>

        <div class="game-info">
            <div class="info-box">
                <h3><span>🎯</span> 分數</h3>
                <p id="score">0</p>
            </div>
            <div class="info-box">
                <h3><span>⏱️</span> 生存時間</h3>
                <p id="time">0s</p>
            </div>
            <div class="info-box">
                <h3><span>🏆</span> 最高分</h3>
                <p id="highScore">0</p>
            </div>
            <div class="info-box">
                <h3><span>⭐</span> 道具數</h3>
                <p id="powerups">0</p>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">
                <span>▶️</span> 開始遊戲
            </button>
            <button id="pauseBtn" disabled>
                <span>⏸️</span> 暫停
            </button>
            <button id="resetBtn" disabled>
                <span>🔄</span> 重新開始
            </button>
        </div>
    </div>

    <div class="instructions">
        <h3><span>🎮</span> 遊戲說明</h3>
        <div class="control-keys">
            <div class="key">WASD / ↑↓←→ : 移動角色</div>
            <div class="key">空格鍵 : 瞬間衝刺 (冷卻5秒)</div>
        </div>
        <p style="margin: 15px 0; font-size: 1.1rem; color: #ffd700;">• 躲避紅色障礙物，碰到會扣分(-20)</p>
        <p style="margin: 10px 0; font-size: 1.1rem; color: #00ff9d;">• 收集金色道具獲得積分(+50)和連擊</p>
        <p style="margin: 10px 0; font-size: 1.1rem; color: #9966ff;">• 連擊越高，得分倍率越高(最高x3)</p>
        
        <div class="powerups-info">
            <div class="powerup-info">
                <span>🌟</span> 無敵盾：5秒內免疫傷害
            </div>
            <div class="powerup-info">
                <span>⚡</span> 加速：移動速度提升2倍
            </div>
            <div class="powerup-info">
                <span>🎯</span> 磁鐵：自動吸引附近道具
            </div>
        </div>
    </div>

    <a href="#" class="back-btn" onclick="window.history.back()">← 返回遊戲館</a>

    <script>
        // DOM元素
        const gameArea = document.getElementById('gameArea');
        const player = document.getElementById('player');
        const scoreElement = document.getElementById('score');
        const timeElement = document.getElementById('time');
        const highScoreElement = document.getElementById('highScore');
        const powerupsElement = document.getElementById('powerups');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameOverlay = document.getElementById('gameOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const finalScore = document.getElementById('finalScore');
        const finalTime = document.getElementById('finalTime');
        const finalPowerups = document.getElementById('finalPowerups');
        const finalCombo = document.getElementById('finalCombo');
        const finalHighScore = document.getElementById('finalHighScore');
        const difficultyButtons = document.querySelectorAll('.difficulty-btn');
        const mobileButtons = document.querySelectorAll('.mobile-btn');

        // 遊戲常量
        const AREA_WIDTH = 600;
        const AREA_HEIGHT = 400;
        const PLAYER_SIZE = 40;
        const DASH_COOLDOWN = 5000; // 5秒冷卻

        // 遊戲變量
        let score = 0;
        let gameTime = 0;
        let highScore = localStorage.getItem('dodgeHighScore') || 0;
        let powerupsCollected = 0;
        let comboCount = 0;
        let comboMultiplier = 1.0;
        let maxCombo = 0;
        let gameActive = false;
        let gamePaused = false;
        let playerX = AREA_WIDTH / 2 - PLAYER_SIZE / 2;
        let playerY = AREA_HEIGHT / 2 - PLAYER_SIZE / 2;
        let obstacles = [];
        let collectibles = [];
        let powerups = [];
        let particles = [];
        let gameLoop;
        let timeInterval;
        let obstacleInterval;
        let collectibleInterval;
        let powerupInterval;
        let difficulty = 'easy';
        let playerSpeed = 6;
        let isInvincible = false;
        let invincibleTimer = 0;
        let speedBoost = false;
        let speedBoostTimer = 0;
        let magnetActive = false;
        let magnetTimer = 0;
        let canDash = true;
        let dashCooldown = 0;
        let gameOver = false;

        const keys = {};

        // 初始化
        highScoreElement.textContent = highScore;
        player.style.left = playerX + 'px';
        player.style.top = playerY + 'px';

        // 難度設置
        const difficultySettings = {
            easy: {
                obstacleSpeed: 1.0,
                obstacleSpawnRate: 1500,
                collectibleSpawnRate: 3000,
                playerSpeed: 6
            },
            medium: {
                obstacleSpeed: 1.5,
                obstacleSpawnRate: 1000,
                collectibleSpawnRate: 2000,
                playerSpeed: 7
            },
            hard: {
                obstacleSpeed: 2.0,
                obstacleSpawnRate: 700,
                collectibleSpawnRate: 1500,
                playerSpeed: 8
            }
        };

        // 創建粒子效果
        function createParticles(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = Math.random() * 10 + 5 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = color;
                particle.style.borderRadius = '50%';
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 2;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                
                gameArea.appendChild(particle);
                
                particles.push({
                    element: particle,
                    x: x,
                    y: y,
                    vx: vx,
                    vy: vy,
                    life: 1.0
                });
            }
        }

        // 更新粒子效果
        function updateParticles() {
            particles.forEach((particle, index) => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= 0.02;
                
                if (particle.element) {
                    particle.element.style.left = particle.x + 'px';
                    particle.element.style.top = particle.y + 'px';
                    particle.element.style.opacity = particle.life;
                }
                
                if (particle.life <= 0) {
                    if (particle.element) particle.element.remove();
                    particles.splice(index, 1);
                }
            });
        }

        // 設置難度
        function setDifficulty(newDifficulty) {
            difficulty = newDifficulty;
            
            difficultyButtons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.difficulty === newDifficulty) {
                    btn.classList.add('active');
                }
            });
            
            playerSpeed = difficultySettings[difficulty].playerSpeed;
            
            // 重新調整生成間隔
            if (gameActive && !gamePaused) {
                clearInterval(obstacleInterval);
                clearInterval(collectibleInterval);
                clearInterval(powerupInterval);
                
                startSpawnIntervals();
            }
        }

        // 開始生成間隔
        function startSpawnIntervals() {
            const settings = difficultySettings[difficulty];
            
            obstacleInterval = setInterval(() => {
                createObstacle();
            }, settings.obstacleSpawnRate);
            
            collectibleInterval = setInterval(() => {
                createCollectible();
            }, settings.collectibleSpawnRate);
            
            powerupInterval = setInterval(() => {
                createPowerup();
            }, 10000); // 每10秒生成一個特殊道具
        }

        // 創建障礙物
        function createObstacle() {
            if (!gameActive || gamePaused) return;
            
            const sizes = ['small', 'medium', 'large'];
            const sizeType = sizes[Math.floor(Math.random() * sizes.length)];
            let size, baseSpeed;
            
            switch(sizeType) {
                case 'small':
                    size = Math.random() * 20 + 15; // 15-35
                    baseSpeed = Math.random() * 4 + 3; // 3-7
                    break;
                case 'medium':
                    size = Math.random() * 25 + 30; // 30-55
                    baseSpeed = Math.random() * 3 + 2; // 2-5
                    break;
                case 'large':
                    size = Math.random() * 30 + 50; // 50-80
                    baseSpeed = Math.random() * 2 + 1; // 1-3
                    break;
            }
            
            const speedMultiplier = difficultySettings[difficulty].obstacleSpeed;
            const speed = baseSpeed * speedMultiplier;
            
            // 隨機生成方向
            const side = Math.floor(Math.random() * 4);
            let x, y, speedX, speedY;
            
            switch(side) {
                case 0: // 左邊進入
                    x = -size;
                    y = Math.random() * (AREA_HEIGHT - size);
                    speedX = speed;
                    speedY = (Math.random() - 0.5) * speed;
                    break;
                case 1: // 右邊進入
                    x = AREA_WIDTH;
                    y = Math.random() * (AREA_HEIGHT - size);
                    speedX = -speed;
                    speedY = (Math.random() - 0.5) * speed;
                    break;
                case 2: // 上面進入
                    x = Math.random() * (AREA_WIDTH - size);
                    y = -size;
                    speedX = (Math.random() - 0.5) * speed;
                    speedY = speed;
                    break;
                case 3: // 下面進入
                    x = Math.random() * (AREA_WIDTH - size);
                    y = AREA_HEIGHT;
                    speedX = (Math.random() - 0.5) * speed;
                    speedY = -speed;
                    break;
            }
            
            const obstacle = {
                element: null,
                x: x,
                y: y,
                width: size,
                height: size,
                speedX: speedX,
                speedY: speedY,
                type: sizeType,
                id: Date.now() + Math.random()
            };
            
            obstacles.push(obstacle);
            createObstacleElement(obstacle);
        }

        // 創建障礙物元素
        function createObstacleElement(obstacle) {
            const element = document.createElement('div');
            element.className = `obstacle ${obstacle.type}`;
            element.style.left = obstacle.x + 'px';
            element.style.top = obstacle.y + 'px';
            element.style.width = obstacle.width + 'px';
            element.style.height = obstacle.height + 'px';
            element.dataset.id = obstacle.id;
            gameArea.appendChild(element);
            obstacle.element = element;
        }

        // 創建收集物
        function createCollectible() {
            if (!gameActive || gamePaused) return;
            
            const collectible = {
                element: null,
                x: Math.random() * (AREA_WIDTH - 25),
                y: Math.random() * (AREA_HEIGHT - 25),
                collected: false,
                id: Date.now() + Math.random()
            };
            
            collectibles.push(collectible);
            createCollectibleElement(collectible);
        }

        // 創建收集物元素
        function createCollectibleElement(collectible) {
            const element = document.createElement('div');
            element.className = 'collectible';
            element.style.left = collectible.x + 'px';
            element.style.top = collectible.y + 'px';
            element.dataset.id = collectible.id;
            gameArea.appendChild(element);
            collectible.element = element;
        }

        // 創建特殊道具
        function createPowerup() {
            if (!gameActive || gamePaused || powerups.length >= 2) return;
            
            const types = ['shield', 'speed', 'magnet'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            const powerup = {
                element: null,
                x: Math.random() * (AREA_WIDTH - 30),
                y: Math.random() * (AREA_HEIGHT - 30),
                type: type,
                collected: false,
                id: Date.now() + Math.random()
            };
            
            powerups.push(powerup);
            createPowerupElement(powerup);
        }

        // 創建特殊道具元素
        function createPowerupElement(powerup) {
            const element = document.createElement('div');
            element.className = `powerup ${powerup.type}`;
            element.style.left = powerup.x + 'px';
            element.style.top = powerup.y + 'px';
            element.textContent = powerup.type === 'shield' ? '🛡️' : 
                                powerup.type === 'speed' ? '⚡' : '🧲';
            element.dataset.id = powerup.id;
            gameArea.appendChild(element);
            powerup.element = element;
        }

        // 碰撞檢測
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // 創建擊中效果
        function createHitEffect(x, y, color = 'rgba(255, 255, 255, 0.8)') {
            const effect = document.createElement('div');
            effect.className = 'hit-effect';
            effect.style.left = (x - 40) + 'px';
            effect.style.top = (y - 40) + 'px';
            effect.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
            gameArea.appendChild(effect);
            
            setTimeout(() => {
                effect.remove();
            }, 600);
        }

        // 更新連擊顯示
        function updateCombo() {
            if (comboCount >= 3) {
                comboMultiplier = Math.min(3.0, 1 + comboCount * 0.15);
                
                // 顯示連擊
                const comboDisplay = document.createElement('div');
                comboDisplay.className = 'combo-display active';
                comboDisplay.textContent = `連擊 x${comboCount}! 🔥 (x${comboMultiplier.toFixed(1)})`;
                comboDisplay.style.left = '10px';
                comboDisplay.style.top = '10px';
                gameArea.appendChild(comboDisplay);
                
                setTimeout(() => {
                    comboDisplay.remove();
                }, 2000);
                
                if (comboCount > maxCombo) {
                    maxCombo = comboCount;
                }
            }
        }

        // 重置連擊
        function resetCombo() {
            comboCount = 0;
            comboMultiplier = 1.0;
        }

        // 玩家衝刺
        function playerDash() {
            if (!canDash || !gameActive || gamePaused) return;
            
            canDash = false;
            dashCooldown = DASH_COOLDOWN;
            
            // 衝刺效果
            const dashSpeed = 20;
            const dashDistance = 100;
            const direction = {
                x: (keys['ArrowRight'] || keys['d'] ? 1 : 0) - (keys['ArrowLeft'] || keys['a'] ? 1 : 0),
                y: (keys['ArrowDown'] || keys['s'] ? 1 : 0) - (keys['ArrowUp'] || keys['w'] ? 1 : 0)
            };
            
            // 如果沒有方向，預設向右
            if (direction.x === 0 && direction.y === 0) {
                direction.x = 1;
            }
            
            const magnitude = Math.sqrt(direction.x * direction.x + direction.y * direction.y);
            direction.x /= magnitude;
            direction.y /= magnitude;
            
            // 更新玩家位置
            playerX = Math.max(0, Math.min(AREA_WIDTH - PLAYER_SIZE, playerX + direction.x * dashDistance));
            playerY = Math.max(0, Math.min(AREA_HEIGHT - PLAYER_SIZE, playerY + direction.y * dashDistance));
            
            // 衝刺視覺效果
            player.style.boxShadow = '0 0 50px rgba(255, 255, 0, 1)';
            createParticles(playerX + PLAYER_SIZE/2, playerY + PLAYER_SIZE/2, 'rgba(255, 255, 0, 0.8)', 15);
            
            setTimeout(() => {
                if (gameActive) {
                    player.style.boxShadow = '0 0 25px rgba(0, 255, 157, 0.8), 0 0 50px rgba(0, 184, 255, 0.4)';
                }
            }, 300);
        }

        // 更新道具顯示
        function updatePowerupDisplay() {
            const powerupDisplay = document.querySelector('.powerup-display');
            powerupDisplay.innerHTML = '';
            
            if (isInvincible) {
                const powerupEl = document.createElement('div');
                powerupEl.className = 'active-powerup';
                powerupEl.innerHTML = '🛡️ 無敵盾 ' + Math.ceil(invincibleTimer/1000) + 's';
                powerupDisplay.appendChild(powerupEl);
            }
            
            if (speedBoost) {
                const powerupEl = document.createElement('div');
                powerupEl.className = 'active-powerup';
                powerupEl.innerHTML = '⚡ 加速 ' + Math.ceil(speedBoostTimer/1000) + 's';
                powerupDisplay.appendChild(powerupEl);
            }
            
            if (magnetActive) {
                const powerupEl = document.createElement('div');
                powerupEl.className = 'active-powerup';
                powerupEl.innerHTML = '🧲 磁鐵 ' + Math.ceil(magnetTimer/1000) + 's';
                powerupDisplay.appendChild(powerupEl);
            }
            
            if (!canDash) {
                const cooldownEl = document.createElement('div');
                cooldownEl.className = 'active-powerup';
                const secondsLeft = Math.ceil(dashCooldown/1000);
                cooldownEl.innerHTML = '💨 衝刺冷卻 ' + secondsLeft + 's';
                powerupDisplay.appendChild(cooldownEl);
            }
        }

        // 激活特殊道具
        function activatePowerup(type) {
            switch(type) {
                case 'shield':
                    isInvincible = true;
                    invincibleTimer = 5000;
                    player.style.background = 'radial-gradient(circle at 30% 30%, #ffff00, #ffaa00)';
                    player.style.boxShadow = '0 0 30px rgba(255, 255, 0, 1)';
                    break;
                    
                case 'speed':
                    speedBoost = true;
                    speedBoostTimer = 5000;
                    break;
                    
                case 'magnet':
                    magnetActive = true;
                    magnetTimer = 7000;
                    break;
            }
            
            updatePowerupDisplay();
        }

        // 結束遊戲
        function endGame() {
            gameActive = false;
            gameOver = true;
            clearInterval(gameLoop);
            clearInterval(timeInterval);
            clearInterval(obstacleInterval);
            clearInterval(collectibleInterval);
            clearInterval(powerupInterval);
            
            // 更新最高分
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('dodgeHighScore', highScore);
                highScoreElement.textContent = highScore;
            }
            
            // 顯示遊戲結束畫面
            finalScore.textContent = score;
            finalTime.textContent = gameTime + '秒';
            finalPowerups.textContent = powerupsCollected;
            finalCombo.textContent = maxCombo;
            finalHighScore.textContent = highScore;
            
            overlayTitle.textContent = '遊戲結束';
            gameOverlay.classList.add('active');
            
            // 按鈕狀態更新
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            resetBtn.disabled = true;
        }

        // 遊戲主循環
        function updateGame() {
            if (!gameActive || gamePaused) return;
            
            // 更新冷卻時間
            if (!canDash) {
                dashCooldown -= 16;
                if (dashCooldown <= 0) {
                    canDash = true;
                }
            }
            
            // 更新道具計時器
            if (isInvincible) {
                invincibleTimer -= 16;
                if (invincibleTimer <= 0) {
                    isInvincible = false;
                    player.style.background = 'radial-gradient(circle at 30% 30%, #00ff9d, #00b8ff)';
                    player.style.boxShadow = '0 0 25px rgba(0, 255, 157, 0.8), 0 0 50px rgba(0, 184, 255, 0.4)';
                }
            }
            
            if (speedBoost) {
                speedBoostTimer -= 16;
                if (speedBoostTimer <= 0) {
                    speedBoost = false;
                }
            }
            
            if (magnetActive) {
                magnetTimer -= 16;
                if (magnetTimer <= 0) {
                    magnetActive = false;
                }
            }
            
            // 更新玩家移動速度
            let currentSpeed = playerSpeed;
            if (speedBoost) currentSpeed *= 2;
            
            // 更新玩家位置
            if (keys['ArrowLeft'] || keys['a']) playerX -= currentSpeed;
            if (keys['ArrowRight'] || keys['d']) playerX += currentSpeed;
            if (keys['ArrowUp'] || keys['w']) playerY -= currentSpeed;
            if (keys['ArrowDown'] || keys['s']) playerY += currentSpeed;
            
            // 邊界檢查
            playerX = Math.max(0, Math.min(playerX, AREA_WIDTH - PLAYER_SIZE));
            playerY = Math.max(0, Math.min(playerY, AREA_HEIGHT - PLAYER_SIZE));
            
            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';
            
            // 更新粒子效果
            updateParticles();
            
            // 更新障礙物位置
            obstacles.forEach((obstacle, index) => {
                obstacle.x += obstacle.speedX;
                obstacle.y += obstacle.speedY;
                
                if (obstacle.element) {
                    obstacle.element.style.left = obstacle.x + 'px';
                    obstacle.element.style.top = obstacle.y + 'px';
                }
                
                // 檢測碰撞
                if (!isInvincible && checkCollision(
                    {x: playerX, y: playerY, width: PLAYER_SIZE, height: PLAYER_SIZE},
                    {x: obstacle.x, y: obstacle.y, width: obstacle.width, height: obstacle.height}
                )) {
                    createHitEffect(playerX + PLAYER_SIZE/2, playerY + PLAYER_SIZE/2, 'rgba(255, 100, 100, 0.8)');
                    createParticles(playerX + PLAYER_SIZE/2, playerY + PLAYER_SIZE/2, '#ff416c', 20);
                    score = Math.max(0, score - 20);
                    scoreElement.textContent = score;
                    resetCombo();
                    
                    // 碰撞反彈效果
                    player.style.transform = 'scale(0.8)';
                    setTimeout(() => {
                        if (gameActive) player.style.transform = 'scale(1)';
                    }, 200);
                    
                    // 簡單模式下不會結束遊戲
                    if (difficulty !== 'easy') {
                        // 困難模式下更容易結束遊戲
                        if (difficulty === 'hard' && score <= 0) {
                            endGame();
                        }
                    }
                }
                
                // 移除超出範圍的障礙物
                if (obstacle.x < -100 || obstacle.x > AREA_WIDTH + 100 || 
                    obstacle.y < -100 || obstacle.y > AREA_HEIGHT + 100) {
                    if (obstacle.element) obstacle.element.remove();
                    obstacles.splice(index, 1);
                }
            });
            
            // 檢測收集物碰撞（包含磁鐵效果）
            collectibles.forEach((collectible, index) => {
                if (!collectible.collected) {
                    // 磁鐵效果
                    if (magnetActive) {
                        const dx = (playerX + PLAYER_SIZE/2) - (collectible.x + 12.5);
                        const dy = (playerY + PLAYER_SIZE/2) - (collectible.y + 12.5);
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < 150) { // 磁鐵吸引範圍
                            const force = 0.2;
                            collectible.x += dx * force;
                            collectible.y += dy * force;
                            
                            if (collectible.element) {
                                collectible.element.style.left = collectible.x + 'px';
                                collectible.element.style.top = collectible.y + 'px';
                            }
                        }
                    }
                    
                    // 碰撞檢測
                    if (checkCollision(
                        {x: playerX, y: playerY, width: PLAYER_SIZE, height: PLAYER_SIZE},
                        {x: collectible.x, y: collectible.y, width: 25, height: 25}
                    )) {
                        // 收集效果
                        createHitEffect(collectible.x + 12.5, collectible.y + 12.5, 'rgba(255, 215, 0, 0.8)');
                        createParticles(collectible.x + 12.5, collectible.y + 12.5, '#ffd700', 15);
                        
                        if (collectible.element) collectible.element.remove();
                        
                        // 更新分數
                        const points = Math.floor(50 * comboMultiplier);
                        score += points;
                        comboCount++;
                        updateCombo();
                        
                        // 顯示得分
                        const pointsDisplay = document.createElement('div');
                        pointsDisplay.style.position = 'absolute';
                        pointsDisplay.style.left = (collectible.x - 10) + 'px';
                        pointsDisplay.style.top = (collectible.y - 20) + 'px';
                        pointsDisplay.style.color = '#ffd700';
                        pointsDisplay.style.fontWeight = 'bold';
                        pointsDisplay.style.fontSize = '1.2rem';
                        pointsDisplay.style.textShadow = '0 0 5px rgba(0,0,0,0.8)';
                        pointsDisplay.style.zIndex = '100';
                        pointsDisplay.textContent = '+' + points;
                        gameArea.appendChild(pointsDisplay);
                        
                        // 動畫效果
                        let opacity = 1;
                        let yPos = collectible.y - 20;
                        const pointsAnim = setInterval(() => {
                            opacity -= 0.05;
                            yPos -= 1;
                            pointsDisplay.style.opacity = opacity;
                            pointsDisplay.style.top = yPos + 'px';
                            
                            if (opacity <= 0) {
                                clearInterval(pointsAnim);
                                pointsDisplay.remove();
                            }
                        }, 50);
                        
                        collectible.collected = true;
                        collectibles.splice(index, 1);
                        
                        scoreElement.textContent = score;
                        powerupsCollected++;
                        powerupsElement.textContent = powerupsCollected;
                    }
                }
            });
            
            // 檢測特殊道具碰撞
            powerups.forEach((powerup, index) => {
                if (!powerup.collected && checkCollision(
                    {x: playerX, y: playerY, width: PLAYER_SIZE, height: PLAYER_SIZE},
                    {x: powerup.x, y: powerup.y, width: 30, height: 30}
                )) {
                    // 收集效果
                    createHitEffect(powerup.x + 15, powerup.y + 15, 
                        powerup.type === 'shield' ? 'rgba(255, 255, 0, 0.8)' : 
                        powerup.type === 'speed' ? 'rgba(0, 255, 136, 0.8)' : 
                        'rgba(153, 102, 255, 0.8)');
                    
                    if (powerup.element) powerup.element.remove();
                    
                    // 激活道具
                    activatePowerup(powerup.type);
                    
                    powerup.collected = true;
                    powerups.splice(index, 1);
                    
                    // 播放音效
                    playSound('powerup');
                }
            });
            
            updatePowerupDisplay();
        }

        // 開始遊戲
        function startGame() {
            if (gameActive) return;
            
            gameActive = true;
            gamePaused = false;
            gameOver = false;
            
            // 重置遊戲狀態
            score = 0;
            gameTime = 0;
            powerupsCollected = 0;
            comboCount = 0;
            comboMultiplier = 1.0;
            maxCombo = 0;
            isInvincible = false;
            speedBoost = false;
            magnetActive = false;
            canDash = true;
            
            // 清除所有遊戲元素
            obstacles.forEach(obs => obs.element && obs.element.remove());
            collectibles.forEach(col => col.element && col.element.remove());
            powerups.forEach(pwr => pwr.element && pwr.element.remove());
            obstacles = [];
            collectibles = [];
            powerups = [];
            particles = [];
            
            // 重置玩家位置
            playerX = AREA_WIDTH / 2 - PLAYER_SIZE / 2;
            playerY = AREA_HEIGHT / 2 - PLAYER_SIZE / 2;
            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';
            player.style.background = 'radial-gradient(circle at 30% 30%, #00ff9d, #00b8ff)';
            player.style.boxShadow = '0 0 25px rgba(0, 255, 157, 0.8), 0 0 50px rgba(0, 184, 255, 0.4)';
            player.style.transform = 'scale(1)';
            
            // 更新顯示
            scoreElement.textContent = score;
            timeElement.textContent = gameTime + '秒';
            powerupsElement.textContent = powerupsCollected;
            gameOverlay.classList.remove('active');
            
            // 啟動遊戲循環
            gameLoop = setInterval(updateGame, 16); // 約60fps
            
            // 啟動計時器
            timeInterval = setInterval(() => {
                if (!gamePaused && gameActive) {
                    gameTime++;
                    timeElement.textContent = gameTime + '秒';
                }
            }, 1000);
            
            // 啟動生成器
            startSpawnIntervals();
            
            // 初始生成一些元素
            setTimeout(() => {
                for (let i = 0; i < 3; i++) {
                    createCollectible();
                }
                createPowerup();
            }, 500);
            
            // 按鈕狀態更新
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            resetBtn.disabled = false;
            pauseBtn.innerHTML = '<span>⏸️</span> 暫停';
        }

        // 暫停遊戲
        function pauseGame() {
            if (!gameActive) return;
            
            gamePaused = !gamePaused;
            
            if (gamePaused) {
                clearInterval(obstacleInterval);
                clearInterval(collectibleInterval);
                clearInterval(powerupInterval);
                pauseBtn.innerHTML = '<span>▶️</span> 繼續';
                
                // 顯示暫停提示
                overlayTitle.textContent = '遊戲暫停';
                gameOverlay.classList.add('active');
            } else {
                startSpawnIntervals();
                pauseBtn.innerHTML = '<span>⏸️</span> 暫停';
                gameOverlay.classList.remove('active');
            }
        }

        // 重置遊戲
        function resetGame() {
            clearInterval(gameLoop);
            clearInterval(timeInterval);
            clearInterval(obstacleInterval);
            clearInterval(collectibleInterval);
            clearInterval(powerupInterval);
            
            gameActive = false;
            gamePaused = false;
            gameOver = false;
            
            // 重置遊戲狀態
            score = 0;
            gameTime = 0;
            powerupsCollected = 0;
            comboCount = 0;
            comboMultiplier = 1.0;
            maxCombo = 0;
            isInvincible = false;
            speedBoost = false;
            magnetActive = false;
            canDash = true;
            
            // 清除所有遊戲元素
            obstacles.forEach(obs => obs.element && obs.element.remove());
            collectibles.forEach(col => col.element && col.element.remove());
            powerups.forEach(pwr => pwr.element && pwr.element.remove());
            obstacles = [];
            collectibles = [];
            powerups = [];
            particles = [];
            
            // 重置玩家位置和外觀
            playerX = AREA_WIDTH / 2 - PLAYER_SIZE / 2;
            playerY = AREA_HEIGHT / 2 - PLAYER_SIZE / 2;
            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';
            player.style.background = 'radial-gradient(circle at 30% 30%, #00ff9d, #00b8ff)';
            player.style.boxShadow = '0 0 25px rgba(0, 255, 157, 0.8), 0 0 50px rgba(0, 184, 255, 0.4)';
            player.style.transform = 'scale(1)';
            
            // 更新顯示
            scoreElement.textContent = score;
            timeElement.textContent = gameTime + '秒';
            powerupsElement.textContent = powerupsCollected;
            gameOverlay.classList.remove('active');
            
            // 按鈕狀態更新
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            resetBtn.disabled = true;
            pauseBtn.innerHTML = '<span>⏸️</span> 暫停';
        }

        // 音效函數
        function playSound(type) {
            // 由於沒有音頻文件，我們使用視覺反饋
            if (type === 'powerup') {
                // 特殊道具收集視覺效果
                const flash = document.createElement('div');
                flash.style.position = 'absolute';
                flash.style.top = '0';
                flash.style.left = '0';
                flash.style.width = '100%';
                flash.style.height = '100%';
                flash.style.background = 'rgba(255, 255, 255, 0.3)';
                flash.style.pointerEvents = 'none';
                flash.style.zIndex = '40';
                flash.style.animation = 'flash 0.3s';
                gameArea.appendChild(flash);
                
                setTimeout(() => {
                    flash.remove();
                }, 300);
            }
        }

        // 事件監聽器
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', pauseGame);
        resetBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('click', () => {
            gameOverlay.classList.remove('active');
            startGame();
        });

        // 鍵盤控制
        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', ' '].includes(e.key)) {
                keys[e.key] = true;
                
                // 防止空格鍵觸發頁面滾動
                if (e.key === ' ') {
                    e.preventDefault();
                    playerDash();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', ' '].includes(e.key)) {
                keys[e.key] = false;
            }
        });

        // 防止頁面滾動
        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key) && gameActive) {
                e.preventDefault();
            }
        });

        // 難度選擇
        difficultyButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                setDifficulty(btn.dataset.difficulty);
            });
        });

        // 觸摸設備控制
        mobileButtons.forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const key = btn.dataset.key;
                keys[key] = true;
                
                if (key === ' ') {
                    playerDash();
                }
            });
            
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                const key = btn.dataset.key;
                keys[key] = false;
            });
            
            // 也支援滑鼠事件
            btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                const key = btn.dataset.key;
                keys[key] = true;
                
                if (key === ' ') {
                    playerDash();
                }
            });
            
            btn.addEventListener('mouseup', (e) => {
                e.preventDefault();
                const key = btn.dataset.key;
                keys[key] = false;
            });
            
            btn.addEventListener('mouseleave', (e) => {
                e.preventDefault();
                const key = btn.dataset.key;
                keys[key] = false;
            });
        });

        // 防止遊戲區域滾動
        gameArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        // 初始化
        setDifficulty('easy');
    </script>
  </div> <!-- gs-game-area -->
  </div> <!-- gs-container -->
</body>
</html>
