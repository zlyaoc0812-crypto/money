<html class="dark"><head>
<meta charset="utf-8"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#833cf6",
                        "accent-blue": "#3b82f6",
                        "accent-green": "#10b981",
                        "accent-gold": "#f59e0b",
                        "background-light": "#f7f5f8",
                        "background-dark": "#0f172a",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .hex-grid {
            background-image: radial-gradient(circle at 2px 2px, rgba(131, 60, 246, 0.15) 1px, transparent 0);
            background-size: 40px 40px;
        }
        .glitch-text {
            text-shadow: 2px 0 #3b82f6, -2px 0 #833cf6;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-hidden">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-hidden">
<div class="absolute inset-0 hex-grid opacity-30 pointer-events-none"></div>
<div class="absolute inset-0 bg-gradient-to-b from-transparent via-background-dark/50 to-background-dark pointer-events-none"></div>
<div class="layout-container flex h-full grow flex-col z-10">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-primary/20 px-10 py-4 backdrop-blur-md bg-background-dark/40">
<div class="flex items-center gap-4 text-slate-100">
<div class="size-6 text-primary">

<path clip-rule="evenodd" d="M24 4H6V17.3333V30.6667H24V44H42V30.6667V17.3333H24V44Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h2 class="text-slate-100 text-xl font-bold leading-tight tracking-tight">Chloe's Entertainment World</h2>
</div>
<div class="flex flex-1 justify-end gap-8 items-center">
<nav class="flex items-center gap-9">
<a class="text-slate-300 hover:text-primary transition-colors text-sm font-medium" href="#">首頁</a>
<a class="text-slate-300 hover:text-primary transition-colors text-sm font-medium" href="#">遊戲庫</a>
<a class="text-slate-300 hover:text-primary transition-colors text-sm font-medium" href="#">社群</a>
<a class="text-slate-300 hover:text-primary transition-colors text-sm font-medium" href="#">商店</a>
</nav>
<div class="flex gap-3">
<button class="flex items-center justify-center rounded-lg h-10 w-10 bg-primary/10 text-primary border border-primary/20 hover:bg-primary/20 transition-all">
<span class="material-symbols-outlined text-[20px]">notifications</span>
</button>
<button class="flex items-center justify-center rounded-lg h-10 w-10 bg-primary/10 text-primary border border-primary/20 hover:bg-primary/20 transition-all">
<span class="material-symbols-outlined text-[20px]">person</span>
</button>
</div>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center relative px-4">
<div class="relative size-80 flex items-center justify-center mb-16">
<!-- Outer Ring: Pulsing Blue Neon -->
<div class="absolute inset-0 rounded-full border-4 border-accent-blue/40 shadow-[0_0_25px_rgba(59,130,246,0.5)] scale-100 animate-pulse"></div>
<!-- Middle Ring: Rotating Dashed Green -->
<div class="absolute inset-4 rounded-full border-4 border-dashed border-accent-green/60 animate-[spin_10s_linear_infinite]"></div>
<!-- Third Ring: Decorative Primary -->
<div class="absolute inset-10 rounded-full border-2 border-primary/30 animate-[spin_6s_linear_infinite_reverse]"></div>
<!-- Inner Core: Glowing Gold Orb -->
<div class="size-24 rounded-full bg-accent-gold shadow-[0_0_50px_rgba(245,158,11,0.6)] flex items-center justify-center">
<div class="size-16 rounded-full bg-gradient-to-br from-accent-gold to-yellow-200 opacity-80"></div>
</div>
<!-- Floating Particles (Decorative spans) -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-1 h-1 bg-accent-blue rounded-full blur-[1px]"></div>
<div class="absolute bottom-10 right-10 w-1 h-1 bg-accent-green rounded-full blur-[1px]"></div>
<div class="absolute top-20 left-10 w-1.5 h-1.5 bg-primary rounded-full blur-[1px]"></div>
</div>
<div class="w-full max-w-md flex flex-col items-center gap-8">
<div class="w-full flex flex-col items-center gap-4">
<h1 class="text-slate-100 text-3xl font-bold tracking-widest glitch-text">正在進入遊戲世界...</h1>
<p class="text-slate-400 text-sm tracking-[0.2em] uppercase">Initialising Neural Link</p>
</div>
<div class="w-full space-y-3">
<div class="flex justify-between items-end px-1">
<div class="flex flex-col">
<span class="text-accent-blue text-xs font-bold uppercase tracking-tighter">System Status</span>
<span class="text-slate-100 text-sm font-medium">數據流同步中...</span>
</div>
<span class="text-accent-blue text-xl font-bold italic">78%</span>
</div>
<div class="h-3 w-full bg-slate-800/50 rounded-full overflow-hidden border border-white/5 p-[2px]">
<div class="h-full rounded-full bg-gradient-to-r from-red-500 via-primary to-accent-blue relative" style="width: 78%;">
<div class="absolute inset-0 bg-[linear-gradient(45deg,rgba(255,255,255,0.2)_25%,transparent_25%,transparent_50%,rgba(255,255,255,0.2)_50%,rgba(255,255,255,0.2)_75%,transparent_75%,transparent)] bg-[length:20px_20px]"></div>
</div>
</div>
<div class="flex justify-center gap-8 pt-2">
<div class="flex items-center gap-2">
<div class="size-1.5 rounded-full bg-accent-green animate-pulse"></div>
<span class="text-[10px] text-slate-500 font-bold uppercase">Asset Server: Online</span>
</div>
<div class="flex items-center gap-2">
<div class="size-1.5 rounded-full bg-accent-green animate-pulse"></div>
<span class="text-[10px] text-slate-500 font-bold uppercase">Latency: 14ms</span>
</div>
</div>
</div>
</div>
</main>
<footer class="p-10 flex justify-between items-center text-slate-500 border-t border-primary/10 bg-background-dark/20 backdrop-blur-sm">
<div class="flex flex-col gap-1">
<p class="text-xs font-medium tracking-wider">SECURE CONNECTION ESTABLISHED</p>
<p class="text-[10px] opacity-50">NODE_ID: CHLOE-ENT-WORLD-HK-01</p>
</div>
<p class="text-sm font-medium">請稍候，精彩即將開始</p>
<div class="flex gap-4">
<span class="material-symbols-outlined text-sm opacity-50">wifi</span>
<span class="material-symbols-outlined text-sm opacity-50">security</span>
<span class="material-symbols-outlined text-sm opacity-50">settings_input_component</span>
</div>
</footer>
</div>
</div>
</body></html>
